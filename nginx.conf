server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Habilitar compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cachear el Service Worker para permitir actualizaciones rápidas de la PWA
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        access_log off;
    }

    # No cachear config.js para que los cambios en variables de entorno del VPS impacten al instante
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        access_log off;
    }

    # No cachear el manifest de la PWA
    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate, max-age=0";
        expires off;
        access_log off;
    }

    # Cachear recursos estáticos (imágenes, fuentes, etc.) por largo tiempo
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp|js|css|woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Páginas de error
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
